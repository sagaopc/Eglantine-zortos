name: lichii-oot-bloom
'on':
  push:
    branches:
    - lichii-oot-*
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} binary
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: windows-x86_64
          runner: windows-2022
    steps:
    - name: Check out source
      uses: actions/checkout@v5
    - name: Fix Windows min macro collision
      shell: pwsh
      run: '$path = ''src/video_core/engines/maxwell_3d.cpp''

        $old = ''std::min(copy_size, room / sizeof(u32) * sizeof(u32))''

        $new = ''(std::min)(copy_size, room / sizeof(u32) * sizeof(u32))''

        $text = [IO.File]::ReadAllText($path)

        if (-not $text.Contains($old)) { throw ''Expected source line missing; review the source revision.'' }

        [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))

        git diff --check

        if ($LASTEXITCODE) { throw ''Patch whitespace check failed'' }

        git diff --stat

        '
    - name: Set up MSVC
      if: matrix.platform == 'windows-x86_64'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install Qt on Windows
      if: matrix.platform == 'windows-x86_64'
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtcharts
        cache: true
    - name: Install sccache on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: '$zip = Join-Path $env:RUNNER_TEMP ''sccache.zip''

        Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip

        Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP ''sccache'')

        $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP ''sccache'')).DirectoryName

        $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

        '
    - name: Install Vulkan SDK on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: ./tools/windows/install-vulkan-sdk.ps1
    - name: Verify Vulkan tools on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: glslangValidator --version
    - name: Restore CPM downloads
      id: cpm-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/cpm
        key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt',
          'src/**/CMakeLists.txt') }}
        restore-keys: 'cpm-${{ matrix.platform }}-v2-

          cpm-${{ runner.os }}-

          '
    - name: Restore compiler objects
      id: compiler-cache
      uses: actions/cache/restore@v5
      with:
        path: '.ccache

          .sccache

          '
        key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'objects-${{ matrix.platform }}-v2-${{ github.sha }}-

          objects-${{ matrix.platform }}-v2-

          '
    - name: Configure Windows
      if: matrix.platform == 'windows-x86_64'
      shell: bash
      run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON -DYUZU_ROOM=OFF
        -DYUZU_ROOM_STANDALONE=OFF -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON -DENABLE_UPDATE_CHECKER=OFF -DLICHII_BUILD_TAG=build-${{
        github.run_number }} -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} -DUSE_DISCORD_PRESENCE=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
    - name: Save CPM downloads
      if: steps.cpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .cache/cpm
        key: ${{ steps.cpm-cache.outputs.cache-primary-key }}
    - name: Build
      if: ${{ ! matrix.mingw }}
      shell: bash
      run: 'set -euo pipefail

        cmake --build build/release --target yuzu yuzu-cmd --parallel 4

        '
    - name: Stop sccache on Windows
      if: always() && matrix.platform == 'windows-x86_64' && steps.compiler-cache.outcome == 'success'
      shell: pwsh
      run: sccache --stop-server
    - name: Save compiler objects
      if: always() && steps.compiler-cache.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: '.ccache

          .sccache

          '
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
    - name: Package Windows binary
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: "foreach ($exe in 'lichii.exe', 'eden-cli.exe') {\n  if (-not (Test-Path \"build/release/bin/$exe\")) {\n    throw \"build/release/bin/$exe\
        \ was not produced\"\n  }\n}\nwindeployqt --release --no-translations build/release/bin/lichii.exe\n\nif ($LASTEXITCODE) { throw \"windeployqt\
        \ failed\" }\n"
    - name: Upload Windows binary
      if: matrix.platform == 'windows-x86_64'
      uses: actions/upload-artifact@v7
      with:
        name: Lichii-oot-bloom-Windows-x64
        path: build/release/bin/
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 180
